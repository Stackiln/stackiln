name: Verify Stackiln
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir fixtures/generated/marketing install --frozen-lockfile
      - run: pnpm --dir fixtures/generated/marketing exec playwright install --with-deps chromium
      - run: pnpm verify
