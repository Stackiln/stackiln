name: Feature request
description: Propose an improvement to StackKiln.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem or limitation should StackKiln address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the desired behaviour without assuming a particular implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or alternative designs have you considered?
  - type: checkboxes
    id: scope
    attributes:
      label: Scope checks
      options:
        - label: I searched existing issues, discussions, and the roadmap.
          required: true
        - label: I understand that a proposal is not a delivery commitment.
          required: true
